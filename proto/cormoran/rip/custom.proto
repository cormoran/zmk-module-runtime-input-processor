syntax = "proto3";

package cormoran.rip;

// Axis snap mode enum
enum AxisSnapMode {
    AXIS_SNAP_MODE_NONE = 0; // No snapping
    AXIS_SNAP_MODE_X = 1;    // Snap to X axis
    AXIS_SNAP_MODE_Y = 2;    // Snap to Y axis
}

// Where a Set* request stores the new value. Mirrors zmk-feature-custom-settings'
// write modes. PERSIST is value 0 so that a request that omits the field (older
// clients, proto3 default) keeps the previous always-persist behavior.
enum WriteMode {
    WRITE_MODE_PERSIST = 0;   // Update the saved value and write it to flash (default)
    WRITE_MODE_MEMORY = 1;    // Update the saved value in RAM only (lost on reboot)
    WRITE_MODE_TEMPORARY = 2; // Apply to the live value only (not part of the saved value)
}

// Runtime Input Processor Messages
message InputProcessorInfo {
    uint32 id = 1;               // Processor ID (index in array)
    string name = 2;             // Short name (max 8 chars for BLE)
    uint32 scale_multiplier = 3; // Scaling multiplier
    uint32 scale_divisor = 4;    // Scaling divisor (multiply by scale_multiplier/scale_divisor)
    int32 rotation_degrees = 5;  // Rotation angle in degrees
    // Auto-mouse layer settings
    bool temp_layer_enabled = 6;                 // Whether temp-layer is enabled
    uint32 temp_layer_layer = 7;                 // Target layer ID for temp-layer
    uint32 temp_layer_activation_delay_ms = 8;   // Delay before activating (ms)
    uint32 temp_layer_deactivation_delay_ms = 9; // Delay before deactivating (ms)
    // Active layers bitmask (0 = all layers)
    uint32 active_layers = 10; // Bitmask of layers where processor is active
    // Axis snap settings
    AxisSnapMode axis_snap_mode = 11; // Snap mode
    uint32 axis_snap_threshold = 12;  // Threshold for unsnapping
    uint32 axis_snap_timeout_ms = 13; // Time window for threshold check (ms)
    // Code mapping features
    bool xy_to_scroll_enabled = 14; // Map X/Y to horizontal/vertical scroll
    bool xy_swap_enabled = 15;      // Swap X and Y axes
    // Axis invert settings
    bool x_invert = 16; // Whether to invert X axis
    bool y_invert = 17; // Whether to invert Y axis
    // Inertia settings.
    uint32 inertia_interval_ms = 18;
    uint32 inertia_threshold = 19;
    uint32 inertia_window_ms = 20;
    uint32 inertia_decay_percent = 21;
    reserved 22, 23;
    bool inertia_notifications_enabled = 24;
    bool inertia_active = 25;
    uint32 inertia_fast_threshold = 26;
    uint32 inertia_fast_output_percent = 27;
    bool inertia_enabled = 28;
    uint32 inertia_normal_max_output = 29; // 0 means unlimited; fast stage ignores it
}

message ListInputProcessorsRequest {
    // Empty - requests list of all input processors
}

message ListInputProcessorsResponse {
    // Empty - use notification to report processors
}

message GetInputProcessorRequest {
    uint32 id = 1; // ID of the input processor
}

message GetInputProcessorResponse { InputProcessorInfo processor = 1; }

message LayerInfo {
    uint32 index = 1; // Layer index
    string name = 2;  // Layer name
}

message GetLayerInfoRequest {
    // Empty - requests list of all layers
}

message GetLayerInfoResponse {
    repeated LayerInfo layers = 1; // List of layers with their names
}

message SetScaleMultiplierRequest {
    uint32 id = 1;             // ID of the input processor to update
    uint32 value = 2;         // New scaling multiplier
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetScaleDivisorRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 value = 2;         // New scaling divisor
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetRotationRequest {
    uint32 id = 1;            // ID of the input processor to update
    int32 value = 2;          // New rotation angle in degrees
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message ResetInputProcessorRequest {
    uint32 id = 1; // ID of the input processor to reset
}

message SetTempLayerEnabledRequest {
    uint32 id = 1;            // ID of the input processor to update
    bool enabled = 2;         // Whether temp-layer is enabled
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetTempLayerLayerRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 layer = 2;         // Target layer ID for temp-layer
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetTempLayerActivationDelayRequest {
    uint32 id = 1;                  // ID of the input processor to update
    uint32 activation_delay_ms = 2; // Delay before activating (ms)
    WriteMode write_mode = 3;       // Where to store the value (default: persist)
}

message SetTempLayerDeactivationDelayRequest {
    uint32 id = 1;                    // ID of the input processor to update
    uint32 deactivation_delay_ms = 2; // Delay before deactivating (ms)
    WriteMode write_mode = 3;         // Where to store the value (default: persist)
}

message SetActiveLayersRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 layers = 2;        // Bitmask of layers where processor is active (0 = all)
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetAxisSnapModeRequest {
    uint32 id = 1;            // ID of the input processor to update
    AxisSnapMode mode = 2;    // Snap mode
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetAxisSnapThresholdRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 threshold = 2;     // Threshold for unsnapping
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetAxisSnapTimeoutRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 timeout_ms = 2;    // Time window for threshold check (ms)
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetXyToScrollEnabledRequest {
    uint32 id = 1;            // ID of the input processor to update
    bool enabled = 2;         // Whether XY-to-scroll mapping is enabled
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetXySwapEnabledRequest {
    uint32 id = 1;            // ID of the input processor to update
    bool enabled = 2;         // Whether XY-swap is enabled
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetScaleMultiplierResponse {
    // Empty - use notification to report changes
}

message SetScaleDivisorResponse {
    // Empty - use notification to report changes
}

message SetRotationResponse {
    // Empty - use notification to report changes
}

message ResetInputProcessorResponse {
    // Empty - use notification to report changes
}

message SetTempLayerEnabledResponse {
    // Empty - use notification to report changes
}

message SetTempLayerLayerResponse {
    // Empty - use notification to report changes
}

message SetTempLayerActivationDelayResponse {
    // Empty - use notification to report changes
}

message SetTempLayerDeactivationDelayResponse {
    // Empty - use notification to report changes
}

message SetActiveLayersResponse {
    // Empty - use notification to report changes
}

message SetAxisSnapModeResponse {
    // Empty - use notification to report changes
}

message SetAxisSnapThresholdResponse {
    // Empty - use notification to report changes
}

message SetAxisSnapTimeoutResponse {
    // Empty - use notification to report changes
}

message SetXyToScrollEnabledResponse {
    // Empty - use notification to report changes
}

message SetXySwapEnabledResponse {
    // Empty - use notification to report changes
}

message SetXInvertRequest {
    uint32 id = 1;            // ID of the input processor to update
    bool invert = 2;          // Whether to invert X axis
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetXInvertResponse {
    // Empty - use notification to report changes
}

message SetYInvertRequest {
    uint32 id = 1;            // ID of the input processor to update
    bool invert = 2;          // Whether to invert Y axis
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetYInvertResponse {
    // Empty - use notification to report changes
}

message SetInertiaIntervalRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 interval_ms = 2;   // Time window and inertia output interval
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetInertiaIntervalResponse {
    // Empty - use notification to report changes
}

message SetInertiaThresholdRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 threshold = 2;     // Must be greater than zero
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetInertiaThresholdResponse {
    // Empty - use notification to report changes
}

message SetInertiaEnabledRequest {
    uint32 id = 1;
    bool enabled = 2;
    WriteMode write_mode = 3;
}

message SetInertiaEnabledResponse {}

message SetInertiaWindowRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 window_ms = 2;     // Input measurement window
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetInertiaWindowResponse {
    // Empty - use notification to report changes
}

message SetInertiaDecayRequest {
    uint32 id = 1;            // ID of the input processor to update
    uint32 decay_percent = 2; // Amount removed after each output interval (0-100)
    WriteMode write_mode = 3; // Where to store the value (default: persist)
}

message SetInertiaDecayResponse {
    // Empty - use notification to report changes
}

message SetInertiaNormalMaxOutputRequest {
    uint32 id = 1;
    uint32 max_output = 2; // 0 means unlimited
    WriteMode write_mode = 3;
}
message SetInertiaNormalMaxOutputResponse {}

message SetInertiaFastThresholdRequest {
    uint32 id = 1;
    uint32 threshold = 2;
    WriteMode write_mode = 3;
}
message SetInertiaFastThresholdResponse {}

message SetInertiaFastOutputPercentRequest {
    uint32 id = 1;
    uint32 percent = 2;
    WriteMode write_mode = 3;
}
message SetInertiaFastOutputPercentResponse {}

message SetInertiaNotificationsRequest {
    uint32 id = 1;
    bool enabled = 2;
}
message SetInertiaNotificationsResponse {}

// Persist every processor's current in-memory settings to flash. Flushes values
// that were set with WRITE_MODE_MEMORY.
message SaveAllSettingsRequest {
    // Empty
}

message SaveAllSettingsResponse {
    // Empty - use notification to report changes
}

// Drop every processor's unsaved (memory) changes and reload the last-saved
// values from flash. Processors that have nothing saved revert to their
// devicetree defaults.
message DiscardAllSettingsRequest {
    // Empty
}

message DiscardAllSettingsResponse {
    // Empty - use notification to report changes
}

// Reset every processor to its devicetree defaults and persist those defaults.
message ResetAllSettingsRequest {
    // Empty
}

message ResetAllSettingsResponse {
    // Empty - use notification to report changes
}

message Request {
    reserved 27, 28;
    oneof request_type {
        ListInputProcessorsRequest list_input_processors = 1;
        GetInputProcessorRequest get_input_processor = 2;
        SetScaleMultiplierRequest set_scale_multiplier = 3;
        SetScaleDivisorRequest set_scale_divisor = 4;
        SetRotationRequest set_rotation = 5;
        ResetInputProcessorRequest reset_input_processor = 6;
        SetTempLayerEnabledRequest set_temp_layer_enabled = 7;
        SetTempLayerLayerRequest set_temp_layer_layer = 8;
        SetTempLayerActivationDelayRequest set_temp_layer_activation_delay = 9;
        SetTempLayerDeactivationDelayRequest set_temp_layer_deactivation_delay = 10;
        SetActiveLayersRequest set_active_layers = 11;
        GetLayerInfoRequest get_layer_info = 12;
        SetAxisSnapModeRequest set_axis_snap_mode = 13;
        SetAxisSnapThresholdRequest set_axis_snap_threshold = 14;
        SetAxisSnapTimeoutRequest set_axis_snap_timeout = 15;
        SetXyToScrollEnabledRequest set_xy_to_scroll_enabled = 16;
        SetXySwapEnabledRequest set_xy_swap_enabled = 17;
        SetXInvertRequest set_x_invert = 18;
        SetYInvertRequest set_y_invert = 19;
        SaveAllSettingsRequest save_all_settings = 20;
        DiscardAllSettingsRequest discard_all_settings = 21;
        ResetAllSettingsRequest reset_all_settings = 22;
        SetInertiaIntervalRequest set_inertia_interval = 23;
        SetInertiaThresholdRequest set_inertia_threshold = 24;
        SetInertiaWindowRequest set_inertia_window = 25;
        SetInertiaDecayRequest set_inertia_decay = 26;
        SetInertiaNotificationsRequest set_inertia_notifications = 29;
        SetInertiaFastThresholdRequest set_inertia_fast_threshold = 30;
        SetInertiaFastOutputPercentRequest set_inertia_fast_output_percent = 31;
        SetInertiaEnabledRequest set_inertia_enabled = 32;
        SetInertiaNormalMaxOutputRequest set_inertia_normal_max_output = 33;
    }
}

message ErrorResponse { string message = 1; }

message Response {
    reserved 28, 29;
    oneof response_type {
        ErrorResponse error = 1;
        ListInputProcessorsResponse list_input_processors = 2;
        GetInputProcessorResponse get_input_processor = 3;
        SetScaleMultiplierResponse set_scale_multiplier = 4;
        SetScaleDivisorResponse set_scale_divisor = 5;
        SetRotationResponse set_rotation = 6;
        ResetInputProcessorResponse reset_input_processor = 7;
        SetTempLayerEnabledResponse set_temp_layer_enabled = 8;
        SetTempLayerLayerResponse set_temp_layer_layer = 9;
        SetTempLayerActivationDelayResponse set_temp_layer_activation_delay = 10;
        SetTempLayerDeactivationDelayResponse set_temp_layer_deactivation_delay = 11;
        SetActiveLayersResponse set_active_layers = 12;
        GetLayerInfoResponse get_layer_info = 13;
        SetAxisSnapModeResponse set_axis_snap_mode = 14;
        SetAxisSnapThresholdResponse set_axis_snap_threshold = 15;
        SetAxisSnapTimeoutResponse set_axis_snap_timeout = 16;
        SetXyToScrollEnabledResponse set_xy_to_scroll_enabled = 17;
        SetXySwapEnabledResponse set_xy_swap_enabled = 18;
        SetXInvertResponse set_x_invert = 19;
        SetYInvertResponse set_y_invert = 20;
        SaveAllSettingsResponse save_all_settings = 21;
        DiscardAllSettingsResponse discard_all_settings = 22;
        ResetAllSettingsResponse reset_all_settings = 23;
        SetInertiaIntervalResponse set_inertia_interval = 24;
        SetInertiaThresholdResponse set_inertia_threshold = 25;
        SetInertiaWindowResponse set_inertia_window = 26;
        SetInertiaDecayResponse set_inertia_decay = 27;
        SetInertiaNotificationsResponse set_inertia_notifications = 30;
        SetInertiaFastThresholdResponse set_inertia_fast_threshold = 31;
        SetInertiaFastOutputPercentResponse set_inertia_fast_output_percent = 32;
        SetInertiaEnabledResponse set_inertia_enabled = 33;
        SetInertiaNormalMaxOutputResponse set_inertia_normal_max_output = 34;
    }
}

// Notifications
message InputProcessorChangedNotification { InputProcessorInfo processor = 1; }
enum InertiaStopReason {
    INERTIA_STOP_REASON_UNSPECIFIED = 0;
    INERTIA_STOP_REASON_SETTLED = 1;
    reserved 2;
    INERTIA_STOP_REASON_REVERSE_INPUT = 3;
    INERTIA_STOP_REASON_LAYER_INACTIVE = 4;
    INERTIA_STOP_REASON_SETTINGS_CHANGED = 5;
}
message InertiaStateChangedNotification {
    uint32 id = 1;
    bool active = 2;
    InertiaStopReason stop_reason = 3;
}
message InertiaFastInputChangedNotification {
    uint32 id = 1;
    bool fast_input = 2;
}

message Notification {
    oneof notification_type {
        InputProcessorChangedNotification input_processor_changed = 1;
        InertiaStateChangedNotification inertia_state_changed = 2;
        InertiaFastInputChangedNotification inertia_fast_input_changed = 3;
    }
}
