CONFIG_MY_AWESOME_KEYBOARD_SPECIAL_FEATURE=y

CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_POINTING=y

# ListInputProcessors paces its per-processor notifications on ZMK's shared
# low-priority work queue; encoding a notification down through the Studio RPC
# core needs more than the 768 B default stack (overflows with an MPU
# stack-guard fault). Raise it (validated on xiao_ble hardware).
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
