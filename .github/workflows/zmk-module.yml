name: Test ZMK Module

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "web/**"
      - ".github/workflows/web-ui.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # Building the extra renode_smoke_test artifact (tests/zmk-config/build.yaml)
    # plus installing Renode and running the Renode test suite takes longer
    # than a plain build; 10 minutes was fine before those existed.
    timeout-minutes: 30
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-west-modules
        with:
          path: dependencies/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{hashFiles('west/**/west*.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
      - name: Init
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          west init -l west --mf west-test-standalone.yml
          west update --narrow
          west zephyr-export
      - name: Test
        # Builds every tests/zmk-config/build.yaml artifact, including
        # renode_smoke_test (the Renode-testable ELF the next step tests) --
        # "build done in a previous step" for the Renode CI action below.
        run: python3 -m unittest -v
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          path: |
            build/*/zephyr/zmk.uf2
      # Hardware-free Renode test (see README.md's "Hardware-free Renode
      # testing" section): boots the renode_smoke_test artifact built above
      # and runs tests/renode/. This action does NOT build firmware itself
      # -- it only tests the ELF path given below. Pinned by commit SHA
      # (immutable). Paths are relative to the checkout root -- do NOT use
      # ${{ github.workspace }} here: in a container job that expression is
      # the runner-host path, not the container's mount path.
      - uses: cormoran/zmk-workspace/.github/actions/zmk-renode-test@5a21480a03eedaf664745e450c9c90e77aaef292
        with:
          elf-path: build/renode_smoke_test/zephyr/zmk.elf
          tests: tests/renode
          west-topdir: .
