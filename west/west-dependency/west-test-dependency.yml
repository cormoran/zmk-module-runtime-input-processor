# List of this module's dependencies for testing
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    - name: zmk
      remote: cormoran
      revision: main+custom-studio-protocol
      import:
        file: app/west.yml
      clone-depth: 1
    # Provides the zmk-build and zmk-test West commands. The Renode-only
    # Studio RPC transport and its snippet are supplied by this module, so
    # its standalone CI manifest does not depend on workspace-local files.
    - name: zmk-west-commands
      remote: cormoran
      revision: main
      import: true
